map $host $host_upstream_mapped {
    hostnames;

    rpc.${DOMAIN_NAME} fluent:8545;
    blockscout.${DOMAIN_NAME} 46.101.249.180:8090;
    faucet.${DOMAIN_NAME} faucet:8080;
    bundler.${DOMAIN_NAME} rundler:8645;
    dashboard.${DOMAIN_NAME} grafana:3000;
}

map $host $host_upstream_mapped_ws {
    hostnames;

    rpc.${DOMAIN_NAME} fluent:8546;
}

server {
  listen 80;

  server_name _;

  location ~ ^/(api/v1/counters|api/v1/lines|api/v1/pages/main|api/v1/pages/transactions|api/v1/pages/contracts|api/v1/charts/batch-update) {
    proxy_pass http://46.101.249.180:8080;
  }

  location / {
    auth_basic off;

    add_header Access-Control-Allow-Origin  "$http_origin";
    add_header Access-Control-Allow-Headers "authorization, content-type";
    add_header Access-Control-Allow-Methods "DELETE, GET, OPTIONS, POST, PUT, UPDATE";

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version  1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    client_max_body_size 100M;

    resolver 127.0.0.11;
    proxy_pass http://$host_upstream_mapped$request_uri;
  }

  location /ws {
    auth_basic off;

    add_header Access-Control-Allow-Origin  "$http_origin";
    add_header Access-Control-Allow-Headers "authorization, content-type";
    add_header Access-Control-Allow-Methods "DELETE, GET, OPTIONS, POST, PUT, UPDATE";

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version  1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    resolver 127.0.0.11;
    proxy_pass http://$host_upstream_mapped_ws$request_uri;
  }
}